experiment_name: "base_run"
device: "cuda"
data_dir: "./data/processed/large50"
save_dir: "./checkpoints_large_multi_50"
plot_dir: "./plots/plotdaughters_large_multi_50"

# Training Hyperparameters
epochs: 1000
batch_size: 128
num_workers: 8          # For DataLoader
lr_g: 0.0001
lr_d: 0.0001
n_critic: 5             # Train D 5 times for every G step
lambda_gp: 10.0         # Gradient Penalty coefficient
lambda_aux: 1.0        # Auxiliary Loss (Multiplicity) coefficient

# Model Architecture
z_dim: 128              # Latent noise dimension
hidden_dim: 256         # Base hidden dimension for MLPs

# Other things
min_daughters: 0
max_daughters: 500 #real max is 13001 